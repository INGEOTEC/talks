<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Lato, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <!-- fila superior: tratado, Constitución, ley electoral -->
  <rect x="10" y="20" width="230" height="64" rx="12" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/>
  <text x="125" y="47" font-size="18" font-weight="700" fill="#1e4f8f" text-anchor="middle">Convención</text>
  <text x="125" y="70" font-size="18" font-weight="700" fill="#1e4f8f" text-anchor="middle">Americana</text>
  <rect x="365" y="20" width="230" height="64" rx="12" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/>
  <text x="480" y="59" font-size="18" font-weight="700" fill="#1e4f8f" text-anchor="middle">Constitución</text>
  <rect x="720" y="20" width="230" height="64" rx="12" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/>
  <text x="835" y="47" font-size="18" font-weight="700" fill="#1e4f8f" text-anchor="middle">Ley electoral</text>
  <text x="835" y="70" font-size="16" fill="#1e4f8f" text-anchor="middle">(LGIPE)</text>
  <!-- relaciones de la fila superior -->
  <line x1="244" y1="52" x2="359" y2="52" stroke="#4b5563" stroke-width="3" marker-end="url(#a)"/>
  <text x="302" y="40" font-size="15" font-weight="700" fill="#9a5b00" text-anchor="middle">un tratado</text>
  <text x="302" y="74" font-size="15" font-weight="700" fill="#9a5b00" text-anchor="middle">la toca</text>
  <line x1="716" y1="52" x2="601" y2="52" stroke="#4b5563" stroke-width="3" marker-end="url(#a)"/>
  <text x="658" y="40" font-size="15" font-weight="700" fill="#9a5b00" text-anchor="middle">una ley</text>
  <text x="658" y="74" font-size="15" font-weight="700" fill="#9a5b00" text-anchor="middle">la desarrolla</text>
  <!-- familia de universidades -->
  <rect x="10" y="120" width="470" height="230" rx="12" fill="#ffffff" stroke="#2f6fbf" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="245" y="148" font-size="16" font-weight="700" fill="#9a5b00" text-anchor="middle">leyes de universidades con una misma plantilla</text>
  <line x1="130" y1="200" x2="360" y2="200" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="130" y1="290" x2="360" y2="290" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="130" y1="200" x2="130" y2="290" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="360" y1="200" x2="360" y2="290" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="130" y1="200" x2="360" y2="290" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="360" y1="200" x2="130" y2="290" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="40" y="175" width="180" height="50" rx="10" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/>
  <text x="130" y="206" font-size="18" fill="#1f2937" text-anchor="middle">Chapingo</text>
  <rect x="270" y="175" width="180" height="50" rx="10" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/>
  <text x="360" y="206" font-size="18" fill="#1f2937" text-anchor="middle">UAM</text>
  <rect x="40" y="265" width="180" height="50" rx="10" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/>
  <text x="130" y="296" font-size="18" fill="#1f2937" text-anchor="middle">Antonio Narro</text>
  <rect x="270" y="265" width="180" height="50" rx="10" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/>
  <text x="360" y="296" font-size="18" fill="#1f2937" text-anchor="middle">UNAM</text>
  <!-- el mapa que falta -->
  <rect x="520" y="120" width="430" height="230" rx="12" fill="#fff4e0" stroke="#d98a00" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="735" y="215" font-size="84" font-weight="700" fill="#d98a00" text-anchor="middle">?</text>
  <text x="735" y="262" font-size="19" font-weight="700" fill="#9a5b00" text-anchor="middle">¿Y el mapa de todas las conexiones</text>
  <text x="735" y="288" font-size="19" font-weight="700" fill="#9a5b00" text-anchor="middle">entre miles de instrumentos?</text>
  <text x="735" y="324" font-size="15" fill="#6b7280" font-style="italic" text-anchor="middle">Nadie lo tiene dibujado</text>
</svg>
