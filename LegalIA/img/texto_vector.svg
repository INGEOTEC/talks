  <text x="656" y="50" font-size="19" font-weight="700" fill="#9a5b00">Un vector de 1,024 números</text>
  <text font-family="'DejaVu Sans Mono', Menlo, monospace" font-size="18" fill="#1f2937">
    <tspan x="656" y="84">[ 0.12</tspan><tspan x="752" y="84">−0.80</tspan><tspan x="848" y="84">0.33</tspan>
    <tspan x="656" y="110">  0.05</tspan><tspan x="752" y="110"> 0.91</tspan><tspan x="848" y="110">−0.27</tspan>
    <tspan x="656" y="136">  …</tspan><tspan x="752" y="136"> …</tspan><tspan x="848" y="136">−0.47 ]</tspan>
  </text>
  <text x="656" y="160" font-size="13" fill="#6b7280" font-style="italic">(valores ilustrativos)</text>
