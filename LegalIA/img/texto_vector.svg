<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" font-family="Lato, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect x="4" y="20" width="330" height="150" rx="12" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/>
  <text x="20" y="50" font-size="19" font-weight="700" fill="#1e4f8f">Un texto: art. 123 constitucional</text>
  <text font-size="18" fill="#1f2937">
    <tspan x="20" y="84">«Toda persona tiene derecho</tspan>
    <tspan x="20" y="110">al trabajo digno y socialmente</tspan>
