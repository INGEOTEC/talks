  <text x="487" y="108" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">lenguaje</text>
  <text x="487" y="140" font-size="14" fill="#cfe0f7" text-anchor="middle">(Qwen3-Embedding)</text>
  <line x1="586" y1="95" x2="636" y2="95" stroke="#4b5563" stroke-width="3" marker-end="url(#a)"/>
