<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" font-family="Lato, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/>
    </marker>
  </defs>
  <!-- Figura del artículo más parecido fuera de su ley (review fix-2, sin la palabra
       que el dueño pidió quitar en review fix-3). Datos del atlas público,
       par Chapingo-UAM del modelo 4B. Extractos literales de los artículos. -->
  <!-- encabezados de las dos leyes -->
  <text x="315" y="24" font-size="17" font-weight="700" fill="#1e4f8f" text-anchor="middle">Ley que crea la Universidad</text>
  <text x="315" y="46" font-size="17" font-weight="700" fill="#1e4f8f" text-anchor="middle">Autónoma Chapingo</text>
  <text x="790" y="24" font-size="17" font-weight="700" fill="#1e4f8f" text-anchor="middle">Ley Orgánica de la Universidad</text>
  <text x="790" y="46" font-size="17" font-weight="700" fill="#1e4f8f" text-anchor="middle">Autónoma Metropolitana</text>
  <!-- Chapingo, capítulo IV -->
  <rect x="160" y="80" width="310" height="40" rx="10" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/>
  <text x="315" y="106" font-size="17" fill="#1f2937" text-anchor="middle">Artículo 13</text>
  <rect x="160" y="130" width="310" height="40" rx="10" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/>
  <text x="315" y="156" font-size="17" fill="#1f2937" text-anchor="middle">Artículo 14</text>
  <rect x="160" y="180" width="310" height="100" rx="10" fill="#fff4e0" stroke="#d98a00" stroke-width="3"/>
  <text x="315" y="208" font-size="18" font-weight="700" fill="#9a5b00" text-anchor="middle">Artículo 15</text>
  <text x="315" y="238" font-size="15" font-style="italic" fill="#1f2937" text-anchor="middle">«Serán considerados empleados</text>
  <text x="315" y="260" font-size="15" font-style="italic" fill="#1f2937" text-anchor="middle">de confianza … el Rector …»</text>
  <rect x="160" y="290" width="310" height="40" rx="10" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/>
  <text x="315" y="316" font-size="17" fill="#1f2937" text-anchor="middle">Artículo 16</text>
  <!-- UAM, capítulo IV -->
  <rect x="630" y="130" width="320" height="40" rx="10" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/>
  <text x="790" y="156" font-size="17" fill="#1f2937" text-anchor="middle">Artículo 35</text>
  <rect x="630" y="180" width="320" height="100" rx="10" fill="#fff4e0" stroke="#d98a00" stroke-width="3"/>
  <text x="790" y="208" font-size="18" font-weight="700" fill="#9a5b00" text-anchor="middle">Artículo 36</text>
  <text x="790" y="238" font-size="15" font-style="italic" fill="#1f2937" text-anchor="middle">«Serán considerados trabajadores</text>
  <text x="790" y="260" font-size="15" font-style="italic" fill="#1f2937" text-anchor="middle">de confianza el Rector General …»</text>
  <rect x="630" y="290" width="320" height="40" rx="10" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/>
  <text x="790" y="316" font-size="17" fill="#1f2937" text-anchor="middle">Artículo 37</text>
  <!-- el más parecido, en otra ley -->
  <line x1="472" y1="230" x2="622" y2="230" stroke="#d98a00" stroke-width="5" marker-end="url(#o)"/>
  <text x="547" y="214" font-size="16" font-weight="700" fill="#9a5b00" text-anchor="middle">el más parecido</text>
  <text x="547" y="258" font-size="16" font-weight="700" fill="#9a5b00" text-anchor="middle">0.91</text>
  <!-- el vecino de casa no cuenta -->
  <path d="M158,215 C88,215 88,150 158,150" fill="none" stroke="#4b5563" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <line x1="98" y1="173" x2="118" y2="193" stroke="#c2410c" stroke-width="4"/>
  <line x1="118" y1="173" x2="98" y2="193" stroke="#c2410c" stroke-width="4"/>
  <text x="78" y="252" font-size="15" font-weight="700" fill="#6b7280" text-anchor="middle">no cuenta,</text>
  <text x="78" y="272" font-size="15" font-weight="700" fill="#6b7280" text-anchor="middle">es la misma ley</text>
  <!-- pie -->
  <text x="480" y="374" font-size="18" fill="#1f2937" text-anchor="middle">Cada fragmento busca el texto más parecido fuera de su propio instrumento.</text>
</svg>
