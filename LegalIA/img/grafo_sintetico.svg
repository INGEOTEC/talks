<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 565" font-family="Lato, 'Helvetica Neue', Arial, sans-serif">
  <!-- El grafo de las leyes (review fix-4, añadida tras la revisión del dueño).
       Grafo INVENTADO para explicar el concepto, no son datos del atlas. El grosor
       de cada flecha es proporcional al número junto a ella (2, 6, 12, 20 dan
       grosores 1, 3, 6, 10). La punta de cada flecha empieza donde acaba la línea. -->
  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="m3" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="m6" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="m10" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <!-- los dos grupos -->
  <rect x="10" y="40" width="580" height="460" rx="14" fill="#ffffff" stroke="#2f6fbf" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="300" y="28" font-size="18" font-weight="700" fill="#1e4f8f" text-anchor="middle">Leyes y reglamentos nacionales</text>
  <rect x="660" y="40" width="290" height="460" rx="14" fill="#ffffff" stroke="#2f6fbf" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="805" y="28" font-size="18" font-weight="700" fill="#1e4f8f" text-anchor="middle">Tratados</text>
  <!-- flechas, origen hacia destino, con su número de fragmentos -->
  <line x1="167" y1="267" x2="254" y2="187" stroke="#4b5563" stroke-width="10" marker-end="url(#m10)"/>
  <text x="234" y="240" font-size="19" font-weight="700" fill="#9a5b00" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">20</text>
  <line x1="258" y1="153" x2="163" y2="240" stroke="#4b5563" stroke-width="3" marker-end="url(#m3)"/>
  <text x="193" y="195" font-size="19" font-weight="700" fill="#9a5b00" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">6</text>
  <line x1="125" y1="407" x2="125" y2="343" stroke="#4b5563" stroke-width="6" marker-end="url(#m6)"/>
  <text x="106" y="371" font-size="19" font-weight="700" fill="#9a5b00" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">12</text>
  <line x1="220" y1="440" x2="360" y2="440" stroke="#4b5563" stroke-width="3" marker-end="url(#m3)"/>
  <text x="298" y="464" font-size="19" font-weight="700" fill="#9a5b00" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">6</text>
  <line x1="470" y1="407" x2="470" y2="349" stroke="#4b5563" stroke-width="10" marker-end="url(#m10)"/>
  <text x="449" y="371" font-size="19" font-weight="700" fill="#9a5b00" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">20</text>
  <line x1="437" y1="259" x2="348" y2="175" stroke="#4b5563" stroke-width="6" marker-end="url(#m6)"/>
  <text x="372" y="230" font-size="19" font-weight="700" fill="#9a5b00" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">12</text>
  <line x1="220" y1="290" x2="364" y2="290" stroke="#4b5563" stroke-width="1" marker-end="url(#m1)"/>
  <text x="298" y="312" font-size="19" font-weight="700" fill="#9a5b00" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">2</text>
  <line x1="811" y1="367" x2="811" y2="229" stroke="#4b5563" stroke-width="10" marker-end="url(#m10)"/>
  <text x="832" y="291" font-size="19" font-weight="700" fill="#9a5b00" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">20</text>
  <line x1="789" y1="203" x2="789" y2="347" stroke="#4b5563" stroke-width="6" marker-end="url(#m6)"/>
  <text x="770" y="291" font-size="19" font-weight="700" fill="#9a5b00" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">12</text>
  <line x1="552" y1="260" x2="708" y2="203" stroke="#4b5563" stroke-width="1" marker-end="url(#m1)"/>
  <text x="629" y="220" font-size="19" font-weight="700" fill="#9a5b00" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">2</text>
  <line x1="705" y1="412" x2="576" y2="427" stroke="#4b5563" stroke-width="1" marker-end="url(#m1)"/>
  <text x="637" y="442" font-size="19" font-weight="700" fill="#9a5b00" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">2</text>
  <!-- las siete leyes inventadas -->
  <rect x="210" y="102" width="180" height="56" rx="12" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/>
  <text x="300" y="137" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Ley A</text>
  <rect x="35" y="262" width="180" height="56" rx="12" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/>
  <text x="125" y="297" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Reglamento de A</text>
  <rect x="35" y="412" width="180" height="56" rx="12" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/>
  <text x="125" y="447" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Lineamiento D</text>
  <rect x="380" y="262" width="180" height="56" rx="12" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/>
  <text x="470" y="297" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Ley B</text>
  <rect x="380" y="412" width="180" height="56" rx="12" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/>
  <text x="470" y="447" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Reglamento C</text>
  <rect x="710" y="142" width="180" height="56" rx="12" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/>
  <text x="800" y="177" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Tratado E</text>
  <rect x="710" y="372" width="180" height="56" rx="12" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/>
  <text x="800" y="407" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Tratado F</text>
  <!-- leyenda -->
  <line x1="40" y1="545" x2="70" y2="545" stroke="#4b5563" stroke-width="1"/>
  <line x1="85" y1="545" x2="115" y2="545" stroke="#4b5563" stroke-width="3"/>
  <line x1="130" y1="545" x2="160" y2="545" stroke="#4b5563" stroke-width="6"/>
  <line x1="175" y1="545" x2="205" y2="545" stroke="#4b5563" stroke-width="10"/>
  <text x="225" y="551" font-size="17" fill="#1f2937">Más gruesa, más fragmentos de una ley con su texto más parecido en la otra</text>
  <text x="10" y="28" font-size="15" font-style="italic" fill="#6b7280">Ejemplo inventado</text>
</svg>
