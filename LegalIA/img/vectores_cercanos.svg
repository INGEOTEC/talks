  <!-- punto lejano -->
  <circle cx="920" cy="150" r="9" fill="#0f8a5f"/>
  <text x="902" y="156" font-size="17" fill="#1f2937" text-anchor="end">Ley de Aguas Nacionales · concesión de agua</text>
  <!-- lejos -->
