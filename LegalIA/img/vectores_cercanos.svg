  <circle cx="128" cy="104" r="9" fill="#2f6fbf"/>
  <text x="182" y="42" font-size="17" fill="#1f2937">Constitución, art. 123 · derecho al trabajo</text>
  <text x="182" y="120" font-size="17" fill="#1f2937">Ley Federal del Trabajo, art. 3 · el trabajo es un derecho</text>
  <path d="M96,56 L176,40" stroke="#94a3b8" stroke-width="1"/>
  <path d="M136,104 L176,116" stroke="#94a3b8" stroke-width="1"/>
  <text x="108" y="160" font-size="16" font-weight="700" fill="#1e4f8f" text-anchor="middle">cerca</text>
  <!-- cluster elecciones -->
  <ellipse cx="380" cy="215" rx="64" ry="40" fill="#fdeaf2" stroke="#c2417a" stroke-width="2" stroke-dasharray="7 5"/>
  <circle cx="360" cy="203" r="9" fill="#c2417a"/>
  <circle cx="400" cy="228" r="9" fill="#c2417a"/>
