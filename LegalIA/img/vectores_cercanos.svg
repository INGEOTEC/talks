<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Lato, 'Helvetica Neue', Arial, sans-serif">
  <rect x="2" y="2" width="956" height="296" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
