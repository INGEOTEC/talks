  <text x="470" y="244" font-size="17" fill="#1f2937">LGIPE · votar es un derecho y una obligación</text>
  <path d="M368,201 L464,203" stroke="#94a3b8" stroke-width="1"/>
  <path d="M408,230 L464,241" stroke="#94a3b8" stroke-width="1"/>
