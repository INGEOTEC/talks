on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

name: Verify freeze cache

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v3
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify every rendered .qmd matches its committed freeze cache
        run: python scripts/render.py --verify-only
