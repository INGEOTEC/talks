<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Lato, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <!-- texto -->
  <rect x="330" y="20" width="300" height="60" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="480" y="59" font-size="26" font-style="italic" fill="#1f2937" text-anchor="middle">«comiendo unos tacos»</text>
  <line x1="420" y1="84" x2="250" y2="140" stroke="#4b5563" stroke-width="3" marker-end="url(#a)"/>
  <line x1="540" y1="84" x2="710" y2="140" stroke="#4b5563" stroke-width="3" marker-end="url(#a)"/>

  <!-- México -->
  <rect x="20" y="144" width="460" height="190" rx="12" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/>
  <text x="250" y="184" font-size="24" font-weight="700" fill="#1e4f8f" text-anchor="middle">Modelo de lenguaje: México</text>
  <text x="250" y="212" font-size="18" fill="#4b5563" text-anchor="middle">entrenado sólo con tuits de México</text>
  <rect x="50" y="244" width="400" height="26" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <rect x="50" y="244" width="340" height="26" rx="6" fill="#2f6fbf"/>
  <text x="250" y="304" font-size="21" fill="#1f2937" text-anchor="middle">probabilidad del texto: <tspan font-weight="700">alta</tspan></text>

  <!-- Argentina -->
  <rect x="480" y="144" width="460" height="190" rx="12" fill="#fff4e0" stroke="#d98a00" stroke-width="2"/>
  <text x="710" y="184" font-size="24" font-weight="700" fill="#9a5b00" text-anchor="middle">Modelo de lenguaje: Argentina</text>
  <text x="710" y="212" font-size="18" fill="#4b5563" text-anchor="middle">entrenado sólo con tuits de Argentina</text>
  <rect x="510" y="244" width="400" height="26" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <rect x="510" y="244" width="90" height="26" rx="6" fill="#d98a00"/>
  <text x="710" y="304" font-size="21" fill="#1f2937" text-anchor="middle">probabilidad del texto: <tspan font-weight="700">baja</tspan></text>

  <line x1="250" y1="340" x2="430" y2="390" stroke="#4b5563" stroke-width="3" marker-end="url(#a)"/>
  <line x1="710" y1="340" x2="530" y2="390" stroke="#4b5563" stroke-width="3" marker-end="url(#a)"/>
  <rect x="250" y="394" width="460" height="110" rx="12" fill="#1e4f8f"/>
  <text x="480" y="438" font-size="24" fill="#ffffff" text-anchor="middle">Gana el modelo con mayor probabilidad</text>
  <text x="480" y="480" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">Clase: México</text>
</svg>
