<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="Lato, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <!-- 1. prompt -->
  <rect x="20" y="14" width="570" height="224" rx="12" fill="#fff4e0" stroke="#d98a00" stroke-width="2"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#9a5b00">1. Prompt: las instrucciones de la tarea</text>
  <text font-size="20" fill="#1f2937">
    <tspan x="40" y="82">Identifica si el siguiente enunciado expresa una</tspan>
    <tspan x="40" y="110">opinión positiva hacia el producto que está</tspan>
    <tspan x="40" y="138">describiendo. En caso de que la opinión sea</tspan>
    <tspan x="40" y="166">positiva contesta con la palabra Positivo, en</tspan>
    <tspan x="40" y="194">caso contrario di Negativo.</tspan>
  </text>
  <!-- 2. texto -->
  <rect x="20" y="268" width="570" height="130" rx="12" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/>
  <text x="40" y="300" font-size="22" font-weight="700" fill="#1e4f8f">2. Texto a clasificar</text>
  <text font-size="22" font-style="italic" fill="#1f2937">
    <tspan x="40" y="344">«La batería dura todo el día y la</tspan>
    <tspan x="40" y="374">cámara es excelente»</tspan>
  </text>
  <!-- flechas -->
  <line x1="594" y1="126" x2="650" y2="210" stroke="#4b5563" stroke-width="3" marker-end="url(#a)"/>
  <line x1="594" y1="333" x2="650" y2="260" stroke="#4b5563" stroke-width="3" marker-end="url(#a)"/>
  <!-- modelo -->
  <rect x="654" y="170" width="150" height="130" rx="12" fill="#1e4f8f"/>
  <text font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="729" y="226">Modelo de</tspan><tspan x="729" y="256">lenguaje</tspan></text>
  <line x1="808" y1="235" x2="838" y2="235" stroke="#4b5563" stroke-width="3" marker-end="url(#a)"/>
  <rect x="842" y="200" width="108" height="70" rx="12" fill="#e6f4ea" stroke="#2e7d32" stroke-width="3"/>
  <text x="896" y="244" font-size="22" font-weight="700" fill="#1b5e20" text-anchor="middle">Positivo</text>
  <text x="480" y="440" font-size="19" fill="#6b7280" text-anchor="middle" font-style="italic">(texto de ejemplo ilustrativo)</text>
</svg>
