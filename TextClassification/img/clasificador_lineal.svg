<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="Lato, 'Helvetica Neue', Arial, sans-serif">
  <rect x="20" y="20" width="580" height="440" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <!-- ejes -->
  <text x="40" y="52" font-size="22" fill="#6b7280" font-style="italic">x₂</text>
  <text x="566" y="448" font-size="22" fill="#6b7280" font-style="italic">x₁</text>
  <!-- recta -->
  <line x1="225" y1="343" x2="570" y2="52" stroke="#1f2937" stroke-width="4"/>
  <!-- clase 0 (azul, círculos) -->
  <g fill="#2f6fbf">
    <circle cx="140" cy="120" r="11"/><circle cx="215" cy="80" r="11"/><circle cx="265" cy="165" r="11"/>
    <circle cx="180" cy="215" r="11"/><circle cx="320" cy="105" r="11"/><circle cx="125" cy="280" r="11"/>
    <circle cx="240" cy="270" r="11"/><circle cx="335" cy="200" r="11"/><circle cx="395" cy="95" r="11"/>
    <circle cx="190" cy="340" r="11"/>
  </g>
  <!-- clase 1 (naranja, triángulos) -->
  <g fill="#d98a00">
    <path d="M400,306 l12,-22 l12,22 z"/><path d="M456,248 l12,-22 l12,22 z"/><path d="M510,360 l12,-22 l12,22 z"/>
    <path d="M370,420 l12,-22 l12,22 z"/><path d="M545,212 l12,-22 l12,22 z"/><path d="M440,410 l12,-22 l12,22 z"/>
    <path d="M300,425 l12,-22 l12,22 z"/><path d="M548,310 l12,-22 l12,22 z"/><path d="M490,150 l12,-22 l12,22 z"/>
    <path d="M520,420 l12,-22 l12,22 z"/>
  </g>
  <!-- leyenda -->
  <circle cx="64" cy="402" r="9" fill="#2f6fbf"/>
  <text x="82" y="409" font-size="20" fill="#1f2937">clase 0</text>
  <path d="M164,412 l10,-18 l10,18 z" fill="#d98a00"/>
  <text x="192" y="409" font-size="20" fill="#1f2937">clase 1</text>
  <!-- fórmula -->
  <rect x="630" y="60" width="310" height="150" rx="12" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/>
  <text x="785" y="100" font-size="22" font-weight="700" fill="#1e4f8f" text-anchor="middle">Modelo lineal</text>
  <text x="785" y="150" font-size="26" fill="#1f2937" text-anchor="middle">y = signo( Σ wᵢ xᵢ + w₀ )</text>
  <text x="785" y="190" font-size="19" fill="#4b5563" text-anchor="middle">+ clase 1 · − clase 0</text>
  <rect x="630" y="240" width="310" height="200" rx="12" fill="#fff4e0" stroke="#d98a00" stroke-width="2"/>
  <text x="785" y="280" font-size="22" font-weight="700" fill="#9a5b00" text-anchor="middle">Aprender es…</text>
  <text font-size="21" fill="#1f2937" text-anchor="middle">
    <tspan x="785" y="322">encontrar los pesos wᵢ</tspan>
    <tspan x="785" y="352">que colocan la recta</tspan>
    <tspan x="785" y="382">entre las dos nubes</tspan>
    <tspan x="785" y="418">de puntos</tspan>
  </text>
</svg>
