<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="Lato, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <!-- texto original -->
  <rect x="20" y="30" width="290" height="140" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="40" y="58" font-size="18" fill="#6b7280">texto original</text>
  <text font-size="20" fill="#1f2937">
    <tspan x="40" y="94">Buenos días, bienvenidos</tspan>
    <tspan x="40" y="122">al curso de PLN.</tspan>
    <tspan x="40" y="150">http://ingeotec.mx @mgraffg</tspan>
  </text>
  <line x1="314" y1="100" x2="364" y2="100" stroke="#4b5563" stroke-width="3" marker-end="url(#a)"/>
  <!-- normalizar -->
  <rect x="368" y="60" width="170" height="80" rx="12" fill="#1e4f8f"/>
  <text x="453" y="110" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">Normalizar</text>
  <text font-size="16" fill="#4b5563" text-anchor="middle">
    <tspan x="453" y="166">minúsculas · sin acentos</tspan>
    <tspan x="453" y="188">sin puntuación</tspan>
    <tspan x="453" y="210">URL → _url · usuario → _usr</tspan>
  </text>
  <line x1="542" y1="100" x2="592" y2="100" stroke="#4b5563" stroke-width="3" marker-end="url(#a)"/>
  <!-- texto normalizado -->
  <rect x="596" y="30" width="344" height="140" rx="12" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/>
  <text x="616" y="58" font-size="18" fill="#6b7280">texto normalizado</text>
  <text font-size="22" fill="#1f2937">
    <tspan x="616" y="98">buenos dias bienvenidos</tspan>
    <tspan x="616" y="130">al curso de pln _url _usr</tspan>
  </text>
  <!-- codo -->
  <path d="M768,174 V250 H110 V292" fill="none" stroke="#4b5563" stroke-width="3" marker-end="url(#a)"/>
  <!-- segmentar -->
  <rect x="20" y="296" width="190" height="80" rx="12" fill="#d98a00"/>
  <text x="115" y="346" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">Segmentar</text>
  <line x1="214" y1="336" x2="254" y2="336" stroke="#4b5563" stroke-width="3" marker-end="url(#a)"/>
  <!-- tokens -->
  <g font-size="21" fill="#1f2937" text-anchor="middle">
    <rect x="258" y="290" width="100" height="42" rx="8" fill="#fff4e0" stroke="#d98a00" stroke-width="2"/><text x="308" y="319">buenos</text>
    <rect x="366" y="290" width="76" height="42" rx="8" fill="#fff4e0" stroke="#d98a00" stroke-width="2"/><text x="404" y="319">dias</text>
    <rect x="450" y="290" width="146" height="42" rx="8" fill="#fff4e0" stroke="#d98a00" stroke-width="2"/><text x="523" y="319">bienvenidos</text>
    <rect x="604" y="290" width="56" height="42" rx="8" fill="#fff4e0" stroke="#d98a00" stroke-width="2"/><text x="632" y="319">al</text>
    <rect x="668" y="290" width="86" height="42" rx="8" fill="#fff4e0" stroke="#d98a00" stroke-width="2"/><text x="711" y="319">curso</text>
    <rect x="258" y="344" width="56" height="42" rx="8" fill="#fff4e0" stroke="#d98a00" stroke-width="2"/><text x="286" y="373">de</text>
    <rect x="322" y="344" width="66" height="42" rx="8" fill="#fff4e0" stroke="#d98a00" stroke-width="2"/><text x="355" y="373">pln</text>
    <rect x="396" y="344" width="76" height="42" rx="8" fill="#fff4e0" stroke="#d98a00" stroke-width="2"/><text x="434" y="373">_url</text>
    <rect x="480" y="344" width="76" height="42" rx="8" fill="#fff4e0" stroke="#d98a00" stroke-width="2"/><text x="518" y="373">_usr</text>
  </g>
  <text x="480" y="440" font-size="22" font-weight="700" fill="#1e4f8f" text-anchor="middle">Primero se normaliza, después se parte en unidades</text>
</svg>
