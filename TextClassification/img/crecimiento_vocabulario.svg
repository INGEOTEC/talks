<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="Lato, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <!-- ejes -->
  <line x1="80" y1="420" x2="80" y2="30" stroke="#4b5563" stroke-width="3" marker-end="url(#a)"/>
  <line x1="80" y1="420" x2="690" y2="420" stroke="#4b5563" stroke-width="3" marker-end="url(#a)"/>
  <text x="385" y="462" font-size="22" fill="#1f2937" text-anchor="middle">número de textos procesados</text>
  <text font-size="22" fill="#1f2937" text-anchor="middle" transform="translate(32,225) rotate(-90)">tamaño del vocabulario</text>
  <!-- curvas -->
  <path d="M80,420 C130,190 330,100 670,58" fill="none" stroke="#d98a00" stroke-width="5"/>
