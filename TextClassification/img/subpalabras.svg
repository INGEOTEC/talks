<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Lato, 'Helvetica Neue', Arial, sans-serif">
  <text x="20" y="40" font-size="23" font-weight="700" fill="#1e4f8f">«buenos días, bienvenidos al curso…»</text>
  <g font-size="24" text-anchor="middle" fill="#1f2937">
    <rect x="29" y="64" width="90" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="74" y="101">[CLS]</text>
    <rect x="127" y="64" width="100" height="56" rx="8" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/><text x="177" y="101">buenos</text>
    <rect x="235" y="64" width="80" height="56" rx="8" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/><text x="275" y="101">días</text>
    <rect x="323" y="64" width="50" height="56" rx="8" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/><text x="348" y="101">,</text>
    <rect x="381" y="64" width="80" height="56" rx="8" fill="#fff4e0" stroke="#d98a00" stroke-width="3"/><text x="421" y="101">bien</text>
    <rect x="469" y="64" width="110" height="56" rx="8" fill="#fff4e0" stroke="#d98a00" stroke-width="3"/><text x="524" y="101">venidos</text>
    <rect x="587" y="64" width="60" height="56" rx="8" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/><text x="617" y="101">al</text>
    <rect x="655" y="64" width="90" height="56" rx="8" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/><text x="700" y="101">curso</text>
    <text x="772" y="101" font-size="30" fill="#6b7280">…</text>
    <rect x="810" y="64" width="90" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="855" y="101">[SEP]</text>
  </g>
  <path d="M381,132 v10 h198 v-10" fill="none" stroke="#d98a00" stroke-width="3"/>
  <text x="480" y="172" font-size="22" font-weight="700" fill="#9a5b00" text-anchor="middle">«bienvenidos»: una palabra, dos piezas</text>

  <text x="20" y="250" font-size="23" font-weight="700" fill="#1e4f8f">«buenox días» (con una errata)</text>
  <g font-size="24" text-anchor="middle" fill="#1f2937">
    <rect x="29" y="274" width="90" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="74" y="311">[CLS]</text>
    <rect x="127" y="274" width="110" height="56" rx="8" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/><text x="182" y="311">bueno</text>
    <rect x="245" y="274" width="60" height="56" rx="8" fill="#fff4e0" stroke="#d98a00" stroke-width="3"/><text x="275" y="311">x</text>
    <rect x="313" y="274" width="80" height="56" rx="8" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/><text x="353" y="311">días</text>
    <rect x="401" y="274" width="90" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="446" y="311">[SEP]</text>
  </g>
  <text font-size="22" fill="#9a5b00" font-weight="700"><tspan x="520" y="298">La errata no es una palabra</tspan><tspan x="520" y="326">nueva: se escribe con piezas</tspan><tspan x="520" y="354">que ya existen</tspan></text>

  <rect x="20" y="410" width="920" height="100" rx="12" fill="#e8f0fb" stroke="#2f6fbf" stroke-width="2"/>
  <text x="480" y="448" font-size="23" font-weight="700" fill="#1e4f8f" text-anchor="middle">Cada pieza tiene un número en un vocabulario fijo</text>
  <text x="480" y="484" font-size="21" fill="#4b5563" text-anchor="middle">de unas 30 mil piezas (segmentador bilmaLAT)</text>
</svg>
